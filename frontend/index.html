<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drone Package Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="contenedor">

        <section class="tarjeta">

            <div class="logo">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <path d="M160 160H80c-44 0-80 36-80 80s36 80 80 80h80v-48H80c-18 0-32-14-32-32s14-32 32-32h80v-48z"/>
        <path d="M352 160h80c44 0 80 36 80 80s-36 80-80 80h-80v-48h80c18 0 32-14 32-32s-14-32-32-32h-80v-48z"/>
        <rect x="160" y="176" width="192" height="160" rx="35"/>
        <circle cx="205" cy="120" r="45"/>
        <circle cx="307" cy="120" r="45"/>
        <circle cx="205" cy="120" r="18"/>
        <circle cx="307" cy="120" r="18"/>
        <circle cx="205" cy="392" r="45"/>
        <circle cx="307" cy="392" r="45"/>
        <circle cx="205" cy="392" r="18"/>
        <circle cx="307" cy="392" r="18"/>
    </svg>
</div>

            <h1>Drone Package Tracker</h1>

            <p class="descripcion">
                Ingresa el ID de tu paquete para conocer su ubicación.
            </p>

            <form id="trackingForm">

                <label for="packageId">
                    ID del paquete
                </label>

                <input 
                    type="text"
                    id="packageId"
                    name="packageId"
                    placeholder="Ejemplo: DRN-001"
                    required
                >

                <button type="submit">
                    Rastrear paquete
                </button>

            </form>

            <a href="#" class="forgot">
                ¿Olvidaste el ID de tu paquete?
            </a>

        </section>

    </main>

    <script src="js/main.js"></script>

</body>

</html>
